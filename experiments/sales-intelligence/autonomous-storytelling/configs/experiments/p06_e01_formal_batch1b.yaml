# Cấu hình Batch 1B Formal Benchmark — HOSTRA AI P06-E01-T09 (Brand Storytelling)
# Trạng thái: APPROVED_BATCH_1B_ONLY — Free Tier, 0 USD, SYNTHETIC only, Global Cap 60 requests.

batch_id: "p06_e01_formal_batch1b_brand_storytelling_s42"
experiment_id: "P06-E01"
provider: "gemini"
model_id: "gemini-3.5-flash-lite"
model_config_path: "configs/models/gemini_3.5_flash_lite_free.yaml"
billing_tier: "free_tier"
max_cost_usd: 0.0
data_classification: "SYNTHETIC"

dataset_profile: "e01_ext_v1"
scenario: "brand_storytelling_10m_ext"
seed: 42
min_chunks_per_topic: 1
max_chunk_duration_sec: 8.0
max_turns: 40

max_requests_per_run: 30
global_max_requests: 60
min_request_interval_sec: 6.0
stop_on_rate_limit: true

output_dir: "runs/P06-E01/formal_benchmark_v1/track1_brand_storytelling_s42"

runs:
  - label: "script_first_upfront_llm"
    method: "script_first_upfront_llm"
    history_window: null
  - label: "langgraph_w5"
    method: "langgraph_structured_story"
    history_window: 5
